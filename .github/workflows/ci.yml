name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-go@v5
              with:
                  go-version: "1.27"
                  cache: true

            - name: Lint
              uses: golangci/golangci-lint-action@v7
              with:
                  version: latest

            - name: Build
              run: go build ./...

            - name: Vet
              run: go vet ./...

            - name: Test
              run: go test ./... -race -cover

    docker:
        needs: test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Build image
              run: docker build -t pricepulse:${{ github.sha }} .
